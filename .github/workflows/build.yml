name: Build SKAM APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p SKAM_Android
          unzip -q app.zip -d SKAM_Android
          cp build.gradle.kts gradle.properties README.md settings.gradle.kts SKAM_Android/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure JVM 17
        run: |
          sed -i 's/VERSION_1_8/VERSION_17/g' SKAM_Android/app/build.gradle.kts
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' SKAM_Android/app/build.gradle.kts
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' SKAM_Android/build.gradle.kts
          grep -n -E 'sourceCompatibility|targetCompatibility|jvmTarget' SKAM_Android/app/build.gradle.kts

      - name: Build APK
        run: gradle -p SKAM_Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SKAM-APK
          path: SKAM_Android/app/build/outputs/apk/debug/*.apk
